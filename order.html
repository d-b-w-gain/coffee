<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Coffee order</title>
<style>
  :root { --bg:#f6f1ea; --fg:#2b211b; --muted:#7a6a5e; --on:#2f7d4f; --brew:#8a5a2b; --card:#fff; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1b1613; --fg:#f1e7dd; --muted:#a8968a; --card:#26201c; --brew:#b07a45; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.4 system-ui, sans-serif;
         min-height:100vh; display:grid; place-items:center; padding:16px; }
  main { background:var(--card); padding:24px 20px; border-radius:16px; width:min(380px, 100%);
         box-shadow:0 4px 20px #0002; text-align:center; }
  h1 { margin:0; font-size:20px; }
  .who { color:var(--muted); margin-top:2px; }
  .summary { font-size:19px; font-weight:600; margin:16px 0 6px; }
  .note { color:var(--muted); font-style:italic; min-height:1.2em; }
  .status { margin:16px 0 4px; font-weight:600; }
  .row { display:flex; gap:8px; margin-top:14px; }
  button { flex:1; font:inherit; font-weight:600; padding:14px 0; border:0; border-radius:10px; cursor:pointer; color:#fff; }
  button:disabled { opacity:.45; cursor:default; }
  .made { background:var(--brew); } .done { background:var(--on); }
  .muted { color:var(--muted); font-size:14px; }
  .box { margin-top:18px; padding:14px; border-radius:12px; background:#efe6db; text-align:left; }
  @media (prefers-color-scheme: dark) { .box, .chip { background:#352c26; } }
  .box b { display:block; margin-bottom:6px; }
  .beans { font-size:24px; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; margin:10px 0 4px; }
  .chip { flex:none; font:inherit; font-size:14px; font-weight:500; padding:8px 12px; border-radius:999px;
          background:#fff; color:inherit; border:1px solid #0002; }
  .chip.on { background:var(--brew); color:#fff; }
  .send { width:100%; background:var(--on); margin-top:10px; }
  .err { color:#a23b2a; font-size:14px; min-height:1.2em; margin-top:6px; }
</style>
</head>
<body>
<main>
  <h1>☕ Coffee order</h1>
  <div id="body"><p class="muted">Loading…</p></div>
</main>
<script>
const id = location.pathname.split('/').pop();
const LABEL = { waiting: 'Waiting to be made', made: 'Made, ready to take over', delivered: 'Delivered ✓' };
let reviewTags = [], picked = new Set(), last = null, timer = null;
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text) e.textContent = text; return e; };

function render(o) {
  const b = document.getElementById('body'); b.textContent = '';
  if (!o || o.status === 'gone') {
    b.append(el('p', 'muted', 'This order is finished and rated, or too old, so it’s been cleared.'));
    return;
  }
  b.append(el('div', 'who', 'for ' + o.who), el('div', 'summary', o.summary), el('div', 'note', o.note || ''),
           el('div', 'status', LABEL[o.status] || o.status));
  if (o.status !== 'delivered') {
    const row = el('div', 'row');
    const made = el('button', 'made', 'Made'); made.disabled = o.status !== 'waiting'; made.onclick = () => set('made');
    const done = el('button', 'done', 'Delivered'); done.onclick = () => set('delivered');
    row.append(made, done); b.append(row);
  }
  if (o.status === 'waiting') return;

  // Their rating of the coffee
  const theirs = el('div', 'box');
  if (o.rating) {
    theirs.append(el('b', '', '🕵️ ' + o.who + '’s verdict'), el('div', 'beans', '🫘'.repeat(o.rating.beans) + '  ' + o.rating.beans + '/5'));
    if (o.rating.tags.length) theirs.append(el('div', '', o.rating.tags.join(' · ')));
    if (o.rating.comment) theirs.append(el('div', 'muted', '“' + o.rating.comment + '”'));
  } else theirs.append(el('b', '', '🕵️ Their verdict'), el('div', 'muted', 'Not rated yet. It’ll appear here.'));
  b.append(theirs);

  // Your review of them: tap only
  const mine = el('div', 'box');
  if (o.review) {
    mine.append(el('b', '', 'Your review of ' + o.who), ...o.review.tags.map(t => el('div', '', '• ' + t)));
  } else {
    mine.append(el('b', '', 'Rate the customer'),
                el('div', 'muted', 'Tap up to four' + (o.has_phone ? '. They’ll get it on Signal.' : '. It shows on their coffee.lan.')));
    const chips = el('div', 'chips');
    const send = el('button', 'send', 'Send review'), err = el('div', 'err');
    send.disabled = !picked.size;
    for (const t of reviewTags) {
      const c = el('button', 'chip' + (picked.has(t) ? ' on' : ''), t);
      c.onclick = () => {
        if (picked.has(t)) picked.delete(t); else if (picked.size < 4) picked.add(t);
        c.classList.toggle('on', picked.has(t)); send.disabled = !picked.size;
      };
      chips.append(c);
    }
    send.onclick = async () => {
      send.disabled = true;
      try {
        const r = await fetch(`/api/order/${id}/review`, { method: 'POST', headers: { 'Content-Type': 'application/json' },
                                                           body: JSON.stringify({ tags: [...picked] }) });
        const j = await r.json();
        if (r.ok || r.status === 409) { if (j.status) last = j; render(j.status ? j : null); }
        else { err.textContent = j.error || 'Couldn’t send'; send.disabled = false; }
      } catch { err.textContent = 'Couldn’t reach the coffee machine'; send.disabled = false; }
    };
    mine.append(chips, send, err);
  }
  b.append(mine);
  if (!o.rating && !timer) timer = setInterval(load, 10000);
}
async function load() {
  try {
    const r = await fetch('/api/order/' + id);
    if (r.ok) {
      const o = await r.json();
      // Don't redraw (and lose taps) unless something changed.
      if (!last || JSON.stringify([o.status, o.rating, o.review]) !== JSON.stringify([last.status, last.rating, last.review])) render(o);
      last = o;
      if (o.rating && timer) { clearInterval(timer); timer = null; }
    } else if (last) { clearInterval(timer); timer = null; }  // cleared once rated both ways; keep showing it
    else render(null);
  } catch {}
}
async function set(s) {
  const r = await fetch(`/api/order/${id}/${s}`, { method: 'POST' });
  if (r.ok) { last = await r.json(); render(last); } else render(null);
}
(async () => {
  try { reviewTags = (await (await fetch('/api/casefile')).json()).review_tags; } catch {}
  load();
})();
</script>
</body>
</html>
