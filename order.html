<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Coffee order</title>
<style>
  :root { --bg:#f6f1ea; --fg:#2b211b; --muted:#7a6a5e; --on:#2f7d4f; --brew:#8a5a2b; --card:#fff; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1b1613; --fg:#f1e7dd; --muted:#a8968a; --card:#26201c; --brew:#b07a45; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.4 system-ui, sans-serif;
         min-height:100vh; display:grid; place-items:center; padding:16px; }
  main { background:var(--card); padding:24px 20px; border-radius:16px; width:min(380px, 100%);
         box-shadow:0 4px 20px #0002; text-align:center; }
  h1 { margin:0; font-size:20px; }
  .who { color:var(--muted); margin-top:2px; }
  .summary { font-size:19px; font-weight:600; margin:16px 0 6px; }
  .note { color:var(--muted); font-style:italic; min-height:1.2em; }
  .status { margin:16px 0 4px; font-weight:600; }
  .row { display:flex; gap:8px; margin-top:14px; }
  button { flex:1; font:inherit; font-weight:600; padding:14px 0; border:0; border-radius:10px; cursor:pointer; color:#fff; }
  button:disabled { opacity:.45; cursor:default; }
  .made { background:var(--brew); } .done { background:var(--on); }
  .muted { color:var(--muted); font-size:14px; }
</style>
</head>
<body>
<main>
  <h1>☕ Coffee order</h1>
  <div id="body"><p class="muted">Loading…</p></div>
</main>
<script>
const id = location.pathname.split('/').pop();
const LABEL = { waiting: 'Waiting to be made', made: 'Made, ready to take over', delivered: 'Delivered ✓' };
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text) e.textContent = text; return e; };

function render(o) {
  const b = document.getElementById('body'); b.textContent = '';
  if (!o || o.status === 'gone') {
    b.append(el('p', 'muted', 'This order is finished, or more than 6 hours old, so it’s been cleared.'));
    return;
  }
  b.append(el('div', 'who', 'for ' + o.who), el('div', 'summary', o.summary), el('div', 'note', o.note || ''),
           el('div', 'status', LABEL[o.status] || o.status));
  if (o.status === 'delivered') { b.append(el('p', 'muted', 'Order cleared.')); return; }
  const row = el('div', 'row');
  const made = el('button', 'made', 'Made'); made.disabled = o.status !== 'waiting'; made.onclick = () => set('made');
  const done = el('button', 'done', 'Delivered'); done.onclick = () => set('delivered');
  row.append(made, done); b.append(row);
}
async function load() {
  try { const r = await fetch('/api/order/' + id); render(r.ok ? await r.json() : null); } catch {}
}
async function set(s) {
  const r = await fetch(`/api/order/${id}/${s}`, { method: 'POST' });
  render(r.ok ? await r.json() : null);
}
load();
</script>
</body>
</html>
